    <path d="M10 300 C 80 268, 150 220, 220 206 S 330 164, 390 120" fill="none" stroke="#eab308" stroke-width="4" stroke-opacity=".85" filter="url(#g)"/>
  </g>
  <circle cx="466" cy="240" r="15" fill="#eab308" filter="url(#g)"/>
  <text x="640" y="236" font-family="ui-monospace,Menlo,monospace" font-size="76" font-weight="700" fill="#eab308">Trade Man</text>
  <text x="642" y="296" font-family="ui-monospace,Menlo,monospace" font-size="28" fill="#fbbf24" fill-opacity=".86">Nobitex · margin agent</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="25" fill="#8496ad">
