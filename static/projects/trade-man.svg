    <text x="642" y="414">RSI(14) &lt; 33  →  BUY</text>
    <text x="642" y="456">TP +1 ATR  ·  SL −4 ATR</text>
    <text x="642" y="506" fill="#38bdf8">logistic regression picks the exit</text>
  </g>
  <rect x="640" y="542" width="268" height="4" rx="2" fill="#eab308" fill-opacity=".5"/>
