<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Trade Man</title>
  <desc id="d">A self-hosted Nobitex trading panel with an automated margin agent and a machine-learning exit model.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#15100a"/><stop offset="1" stop-color="#070b11"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="10" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g stroke="#eab308" stroke-opacity=".07" stroke-width="1.5"><path d="M0 170h1200M0 290h1200M0 410h1200M0 530h1200"/></g>
  <g transform="translate(96 120)">
    <g stroke-width="7" stroke-linecap="round">
      <path d="M20 300v-96" stroke="#22c55e"/><path d="M70 236v104" stroke="#ef4444"/>
      <path d="M120 276v-132" stroke="#22c55e"/><path d="M170 232v-104" stroke="#22c55e"/>
      <path d="M220 160v122" stroke="#ef4444"/><path d="M270 268v-146" stroke="#22c55e"/>
      <path d="M320 136v118" stroke="#ef4444"/><path d="M370 254v-160" stroke="#22c55e"/>
    </g>
    <g stroke-width="22" stroke-linecap="round">
      <path d="M20 262v-58" stroke="#22c55e"/><path d="M70 268v42" stroke="#ef4444"/>
      <path d="M120 236v-72" stroke="#22c55e"/><path d="M170 198v-48" stroke="#22c55e"/>
      <path d="M220 192v62" stroke="#ef4444"/><path d="M270 228v-88" stroke="#22c55e"/>
      <path d="M320 166v62" stroke="#ef4444"/><path d="M370 212v-100" stroke="#22c55e"/>
