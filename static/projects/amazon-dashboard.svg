<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="t d">
  <title id="t">Amazon Seller Dashboard</title>
  <desc id="d">A fourteen-module Streamlit control centre for running an Amazon.ae seller account.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#1c1203"/><stop offset="1" stop-color="#0b0f16"/></linearGradient>
    <linearGradient id="ar" x2="0" y2="1"><stop stop-color="#ff9900" stop-opacity=".55"/><stop offset="1" stop-color="#ff9900" stop-opacity="0"/></linearGradient>
    <filter id="g"><feGaussianBlur stdDeviation="9" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <g transform="translate(92 96)">
    <g fill="#121923" stroke="#ff9900" stroke-opacity=".2">
      <rect width="110" height="72" rx="14"/><rect x="124" width="110" height="72" rx="14"/>
      <rect x="248" width="110" height="72" rx="14"/><rect x="372" width="110" height="72" rx="14"/>
    </g>
    <g fill="#ff9900" font-family="ui-monospace,Menlo,monospace" font-size="24" font-weight="700">
      <text x="18" y="46">68.4k</text><text x="142" y="46">14.8k</text>
      <text x="266" y="46">412</text><text x="390" y="46">18%</text>
    </g>
    <g fill="#8a9ab1" font-family="ui-monospace,Menlo,monospace" font-size="13">
      <text x="18" y="64">revenue</text><text x="142" y="64">profit</text>
      <text x="266" y="64">orders</text><text x="390" y="64">ACoS</text>
    </g>
  </g>
  <g transform="translate(92 206)">
    <rect width="482" height="226" rx="16" fill="#121923" stroke="#ff9900" stroke-opacity=".16"/>
    <path d="M26 186 C 86 162, 118 178, 158 140 S 232 96, 278 112 S 360 62, 420 44 L456 38 L456 200 L26 200 Z" fill="url(#ar)"/>
    <path d="M26 186 C 86 162, 118 178, 158 140 S 232 96, 278 112 S 360 62, 420 44 L456 38" fill="none" stroke="#ff9900" stroke-width="4" stroke-linejoin="round" filter="url(#g)"/>
    <g stroke="#8a9ab1" stroke-opacity=".12" stroke-width="1.5"><path d="M26 60h430M26 120h430M26 180h430"/></g>
  </g>
  <g transform="translate(92 456)" fill="#18212e">
    <rect width="88" height="30" rx="9"/><rect x="98" width="88" height="30" rx="9"/>
    <rect x="196" width="88" height="30" rx="9" fill="#ff9900" fill-opacity=".22"/>
    <rect x="294" width="88" height="30" rx="9"/><rect x="392" width="90" height="30" rx="9"/>
  </g>
  <text x="648" y="236" font-family="ui-monospace,Menlo,monospace" font-size="60" font-weight="700" fill="#ff9900">Amazon.ae</text>
  <text x="650" y="296" font-family="Vazirmatn,system-ui,sans-serif" font-size="34" fill="#ffc46b">داشبورد فروشندگی</text>
  <g font-family="ui-monospace,Menlo,monospace" font-size="24" fill="#8a9ab1">
    <text x="650" y="372">14 modules · Streamlit</text>
    <text x="650" y="414">SQLite state · price history</text>
    <text x="650" y="456">mock data → live SP-API</text>
  </g>
  <text x="650" y="508" font-family="ui-monospace,Menlo,monospace" font-size="22" fill="#34d399">USE_MOCK = False</text>
  <rect x="648" y="542" width="264" height="4" rx="2" fill="#ff9900" fill-opacity=".5"/>
</svg>
