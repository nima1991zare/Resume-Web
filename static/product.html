<body>
  <canvas id="morph-canvas" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <header class="topbar">

        <!--P:IMAGE-->
      </div>

        <div class="pd-actions" id="pd-actions"></div>
        <p class="pd-note" id="pd-note" hidden></p>

  <footer class="v2-footer">

  <script id="product-data" type="application/json"><!--P:DATA--></script>
